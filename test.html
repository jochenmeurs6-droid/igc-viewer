<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dateiauswahl-Test</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#fff;color:#111}
  h1{font-size:1.2rem;margin:0 0 4px}
  p{margin:0 0 16px;color:#555;font-size:.9rem}
  label{display:block;margin:0 0 10px;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:1rem;background:#f6f8fa}
  label b{display:inline-block;min-width:1.6em;color:#1f6feb}
  label span{display:block;font-size:.8rem;color:#666;margin-top:4px;font-family:monospace}
  input{display:none}
  #out{margin-top:16px;padding:12px;border-radius:10px;background:#eef6ee;font-size:.9rem;white-space:pre-wrap}
  #ua{margin-top:16px;font-size:.7rem;color:#888;word-break:break-all}
</style>
</head>
<body>
<h1>Dateiauswahl-Test</h1>
<p>Tippe die Knöpfe der Reihe nach an. Notiere dir bei jedem, ob <b>Downloads / Eigene Dateien</b> angeboten wird und ob sich die .igc-Datei auswählen lässt.</p>
<div id="list"></div>
<div id="out">Noch keine Datei gewählt.</div>
<div id="ua"></div>
<script>
const variants = [
  ['ohne Filter', null],
  ['*/*', '*/*'],
  ['application/octet-stream', 'application/octet-stream'],
  ['application/*', 'application/*'],
  ['text/plain', 'text/plain'],
  ['.igc', '.igc'],
  ['.igc + .txt + .pdf', '.igc,.txt,.pdf'],
];
const list = document.getElementById('list');
variants.forEach(([name, accept], i) => {
  const l = document.createElement('label');
  l.innerHTML = `<b>${i + 1}</b> ${name}<span>accept=${accept === null ? '(keins)' : accept}</span>`;
  const inp = document.createElement('input');
  inp.type = 'file';
  if (accept !== null) inp.accept = accept;
  inp.onchange = () => {
    const f = inp.files[0];
    document.getElementById('out').textContent = f
      ? `Knopf ${i + 1}: ${f.name}\nTyp: ${f.type || '(leer)'}\nGröße: ${f.size} Bytes`
      : `Knopf ${i + 1}: nichts gewählt`;
    inp.value = '';
  };
  l.appendChild(inp);
  list.appendChild(l);
});
document.getElementById('ua').textContent = navigator.userAgent;
</script>
</body>
</html>
